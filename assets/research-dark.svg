<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 788" width="1200" height="788" role="img" aria-label="Linhas de pesquisa em inglês, francês, latim e português">
<style>
  .t{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
  
  .lg{opacity:0;animation:lg 20s linear infinite both}
  .lg.f{opacity:1}
  @keyframes lg{0%{opacity:0}2.5%{opacity:1}22.5%{opacity:1}25%{opacity:0}100%{opacity:0}}

  .ic{transform-box:fill-box;transform-origin:center}
  .ic-eeg path{stroke-dasharray:90;animation:eegd 3s ease-in-out infinite}
  @keyframes eegd{0%{stroke-dashoffset:90}55%,100%{stroke-dashoffset:0}}
  .ic-fire{animation:flick 1.4s ease-in-out infinite}
  @keyframes flick{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(.94,1.07) rotate(-3deg)}60%{transform:scale(1.04,.96) rotate(2deg)}}
  .ic-phone{animation:vib 5s infinite}
  @keyframes vib{0%,70%,100%{transform:rotate(0)}72%{transform:rotate(-9deg)}76%{transform:rotate(9deg)}80%{transform:rotate(-7deg)}84%{transform:rotate(6deg)}88%{transform:rotate(0)}}
  .ic-dice{animation:roll 6s ease-in-out infinite}
  @keyframes roll{0%,60%{transform:rotate(0)}80%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
  .ic-doc line{stroke-dasharray:16;animation:ln 4s ease-out infinite}
  @keyframes ln{0%{stroke-dashoffset:16}40%,100%{stroke-dashoffset:0}}
  .ic-peak{animation:pk 5s ease-in-out infinite} @keyframes pk{50%{transform:translateY(-3px) scale(1.06)}}
  .ic-rocket{animation:rk 2.6s ease-in-out infinite} @keyframes rk{0%,100%{transform:translateY(2px) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
  .ic-car{animation:cr 3s ease-in-out infinite} @keyframes cr{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

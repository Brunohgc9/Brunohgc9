  <g class="lg f" style="animation-delay:0s"><text class="t" x="132" y="66" font-size="23" font-weight="700" fill="#F6F1E4">Neurocomputing</text>
<text class="t" x="132" y="94" font-size="16" fill="#9aa68f">EEG acquisition with the ADS1299; web and mobile layers for neurodata.</text>

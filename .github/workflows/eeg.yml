name: EEG das contribuições

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia, 03:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/eeg.py"]

permissions:
  contents: write

jobs:
  eeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar eeg-dark.svg e eeg-light.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/eeg.py
      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/eeg-dark.svg assets/eeg-light.svg
          git diff --cached --quiet || git commit -m "chore: atualiza EEG das contribuições"
          git push
